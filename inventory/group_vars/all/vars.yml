# Host users configuration
user: "{{ ansible_user }}"
users_to_create:
  - name: "emmental"
    group: "emmental"
    hosts:
      - "all"
    ssh_key_file: "~/.ssh/id_rsa.pub"

# Docker configuration
docker_users:
  - "{{ ansible_user }}"

user_id: 1000
group_id: 987

timezone: "Africa/Nairobi"

custom_dns: "192.168.100.26"

default_domain: "{{ vault_domain }}"
default_subdomain: "{{ vault_subdomain }}"
domain_final: "{{ my_domain | default(default_domain) }}"
subdomain_final: "{{ subdomain | default(default_subdomain) }}"
domain: "{{ (subdomain_final | default('') | length > 0) | ternary(subdomain_final ~ '.', '') }}{{ domain_final }}"

# Backup settings - on the media disk: off the (small) root disk, and survives a root-disk failure
backup_base_dir: "/mnt/media/backups"
backup_retention_local: 14
backup_retention_remote: 90

# S3 backup configuration (credentials in vault.yml)
backup_s3_enabled: true
backup_s3_remote_name: "s3backup"
backup_s3_bucket: "quadraplex-backups"
backup_s3_path_prefix: "{{ inventory_hostname }}"
backup_s3_provider: "Other"
backup_s3_region: "us-east-1"
backup_s3_storage_class: "STANDARD"
backup_s3_encryption: "AES256"
backup_s3_access_key: "{{ vault_backup_s3_access_key }}"
backup_s3_secret_key: "{{ vault_backup_s3_secret_key }}"
backup_s3_endpoint: "{{ vault_backup_s3_endpoint }}"

# Backup notification settings (optional Gotify integration)
backup_gotify_enabled: false
backup_gotify_url: "http://localhost:8080"
backup_gotify_token: "{{ vault_backup_gotify_token | default('') }}"

