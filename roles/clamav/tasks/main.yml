---
- name: Install ClamAV packages (Debian/Ubuntu)
  apt:
    name:
      - clamav
      - clamav-freshclam
      - curl
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# The scan uses standalone clamscan, so clamd only holds the signature DB in RAM for nothing.
- name: Stop and disable clamd (unused by the scan)
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - clamav-daemon.socket
    - clamav-daemon.service
  register: clamd_off
  failed_when: clamd_off is failed and 'Could not find' not in (clamd_off.msg | default(''))
  when: ansible_os_family == "Debian"

- name: Install ClamAV packages (RedHat/CentOS)
  yum:
    name:
      - clamav
      - clamav-update
      - clamd
      - curl
    state: present
  when: ansible_os_family == "RedHat"

- name: Stop freshclam service temporarily
  systemd:
    name: clamav-freshclam
    state: stopped
  ignore_errors: yes

- name: Update ClamAV virus definitions
  command: freshclam
  register: freshclam_result
  ignore_errors: yes

- name: Start and enable freshclam service
  systemd:
    name: clamav-freshclam
    state: started
    enabled: yes

- name: Ensure ClamAV log directory exists
  file:
    path: "{{ clamav_log_dir }}"
    state: directory
    mode: '0755'

- name: Deploy ClamAV scan script
  template:
    src: clamav-scan.sh.j2
    dest: /usr/local/bin/clamav-scan.sh
    mode: '0700'  # holds the Gotify token

# Same name as the entry already in root's crontab, so it is replaced in place, not duplicated.
- name: Create cron job for automated scans
  cron:
    name: "ClamAV automated scan"
    minute: "{{ clamav_cron_minute }}"
    hour: "{{ clamav_cron_hour }}"
    weekday: "{{ clamav_cron_weekday }}"
    job: "/usr/local/bin/clamav-scan.sh"
    user: root
    state: present

- name: Configure logrotate for ClamAV scans
  copy:
    src: clamav-logrotate
    dest: /etc/logrotate.d/clamav-scan
    mode: '0644'

- name: Display completion message
  debug:
    msg: 
      - "ClamAV has been configured successfully!"
      - "Cron schedule (minute hour weekday): {{ clamav_cron_minute }} {{ clamav_cron_hour }} {{ clamav_cron_weekday }}"
      - "Scanning: {{ clamav_scan_dirs | join(' ') }}"
      - "Gotify notifications: {{ 'Enabled' if (clamav_gotify_enabled | bool) and clamav_gotify_url and clamav_gotify_token else 'DISABLED - detections are only logged (set backup_gotify_enabled/url and vault_backup_gotify_token)' }}"
      - "Log file: {{ clamav_log_file }}"
      - "Manual test: /usr/local/bin/clamav-scan.sh"
