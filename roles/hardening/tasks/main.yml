---
# 00- sorts before 50-cloud-init.conf, and sshd keeps the first value it reads.
- name: Key-only SSH, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible (roles/hardening)
      PasswordAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowUsers {{ hardening_ssh_allow_users | join(' ') }}
    mode: '0644'
    validate: sshd -t -f %s
  register: hardening_sshd

# Reload (not restart) so open sessions survive; a bad config fails here before the reload.
- name: Validate sshd config and reload
  when: hardening_sshd is changed
  ansible.builtin.shell: sshd -t && systemctl reload ssh

- name: Remove users from the docker group
  ansible.builtin.shell: id -nG {{ item }} | grep -qw docker && gpasswd -d {{ item }} docker || true
  register: hardening_docker_group
  changed_when: "'Removing' in hardening_docker_group.stdout"
  loop: "{{ hardening_docker_group_remove }}"

- name: Install unattended-upgrades and smartmontools
  ansible.builtin.package:
    name: [unattended-upgrades, smartmontools]
    state: present

- name: Configure automatic updates
  ansible.builtin.copy:
    dest: "/etc/apt/apt.conf.d/{{ item.name }}"
    content: "{{ item.content }}"
    mode: '0644'
  loop:
    - name: 20auto-upgrades
      content: |
        APT::Periodic::Update-Package-Lists "1";
        APT::Periodic::Unattended-Upgrade "1";
    - name: 52quadraplex-unattended
      content: |
        // Managed by Ansible (roles/hardening)
        Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
        Unattended-Upgrade::Remove-Unused-Dependencies "true";
        Unattended-Upgrade::Automatic-Reboot "false";
  loop_control:
    label: "{{ item.name }}"

- name: Enable SMART monitoring
  ansible.builtin.systemd:
    name: smartmontools
    enabled: true
    state: started

- name: Stop, disable and mask unused services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ hardening_masked_units }}"

- name: Remove unused snaps
  community.general.snap:
    name: "{{ hardening_snaps_remove }}"
    state: absent

# Old secrets left behind by `backup: yes` on the stack .env templates (/opt/<stack>/.env.<pid>.<date>~).
- name: Find stale .env backups in the stack directories
  ansible.builtin.find:
    paths: /opt
    patterns: '.env.*~'
    hidden: true
    recurse: true
    depth: 2
  register: hardening_env_backups

- name: Delete stale .env backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hardening_env_backups.files }}"
  loop_control:
    label: "{{ item.path }}"
