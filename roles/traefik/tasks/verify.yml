---
- name: Wait for services to be ready
  wait_for:
    port: "{{ item.port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 300
    msg: "{{ item.service }} service did not start within 5 minutes"
  loop:
    - { service: "Traefik", port: "{{ proxy_services.traefik.http }}" }
  when: services[item.service.lower().replace(' ', '_')].enabled | default(true)

- name: Check Docker container status
  ansible.builtin.shell:
    cmd: docker inspect {{ item }} --format='{% raw %}{{.State.Status}}{% endraw %}'
  register: container_status
  loop:
    - traefik
  when: services[item.replace('-', '_')].enabled | default(true)
  changed_when: false
  failed_when: false

- name: Verify containers are running
  assert:
    that:
      - item.rc == 0
      - item.stdout == "running"
    fail_msg: "Container {{ item.item }} is not running properly (status: {{ item.stdout | default('not found') }})"
    success_msg: "Container {{ item.item }} is running"
  loop: "{{ container_status.results }}"
  when: item.item is defined and services[item.item.replace('-', '_')].enabled | default(true)

- name: Get runtime user UID
  ansible.builtin.shell:
    cmd: "id -u {{ proxy_stack_runtime_user }}"
  register: runtime_user_uid
  changed_when: false

- name: Get runtime group GID
  ansible.builtin.shell:
    cmd: "getent group {{ proxy_stack_runtime_group }} | cut -d: -f3"
  register: runtime_group_gid
  changed_when: false

- name: Verify data directory permissions
  stat:
    path: "{{ proxy_stack.data_path }}/{{ item }}"
  register: data_dir_stats
  loop:
    - traefik
  when: services[item.replace('-', '_')].enabled | default(true)

- name: Check data directory ownership
  assert:
    that:
      - data_dir_stats.results[index].stat.uid == runtime_user_uid.stdout | int
      - data_dir_stats.results[index].stat.gid == runtime_group_gid.stdout | int
    fail_msg: "Data directory {{ item }} has incorrect ownership (expected {{ proxy_stack_runtime_user }}:{{ proxy_stack_runtime_group }})"
  loop:
    - traefik
  loop_control:
    index_var: index
  when:
    - services[item.replace('-', '_')].enabled | default(true)
    - data_dir_stats.results[index].stat.exists

- name: Check systemd service status
  systemd:
    name: proxy-stack
    state: started
  register: systemd_status

- name: Verify systemd service is enabled
  command: systemctl is-enabled proxy-stack
  register: systemd_enabled
  changed_when: false
  failed_when: systemd_enabled.stdout != "enabled"
