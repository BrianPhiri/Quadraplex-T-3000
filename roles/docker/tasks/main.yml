- name: Determine Docker version for this distribution
  set_fact:
    docker_version: "{{ docker_version | default(docker.versions[ansible_distribution_version] | default(docker.default_version)) }}"
    containerd_version: "{{ containerd_version | default(docker.containerd[ansible_distribution_version] | default(docker.default_containerd)) }}"

- name: Display selected Docker version
  debug:
    msg:
      - "Installing Docker version {{ docker_version }} for {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "Containerd version: {{ containerd_version }}"

- name: Include installation tasks
  include_tasks: install.yml
  tags: ['docker', 'install']

- name: Include configuration tasks
  include_tasks: configure.yml
  tags: ['docker', 'configure']

- name: Include verification tasks
  include_tasks: verify.yml
  tags: ['docker', 'verify']
