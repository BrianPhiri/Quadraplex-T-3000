---
# Backup role default variables

# Backup base directory
backup_base_dir: "/backup"

# Backup retention (days)
backup_retention_local: 14
backup_retention_remote: 90

# S3/rclone configuration
backup_s3_enabled: true
backup_s3_remote_name: "s3backup"
backup_s3_bucket: "quadraplex-backups"
backup_s3_path_prefix: "{{ inventory_hostname }}"

# Rclone runs via the official Docker image rather than a host-installed binary,
# consistent with how every other piece of software in this repo runs.
backup_rclone_config_dir: "/root/.config/rclone"
backup_rclone_bin: >-
  docker run --rm
  -v {{ backup_rclone_config_dir }}:/config/rclone
  -v {{ backup_base_dir }}:{{ backup_base_dir }}
  rclone/rclone:1.75.2

# Backup notification settings
backup_gotify_enabled: false
backup_gotify_url: ""
backup_gotify_token: ""

# Each stack directory is archived whole (configs + data). Every SQLite DB inside
# is found automatically and copied with `.backup`, so new services need no entry here.
backup_stacks:
  - { name: proxy, path: /opt/proxy }
  - { name: dns, path: /opt/dns-stack }
  - { name: media, path: /opt/media-stack }
  - { name: utility, path: /opt/utility-stack }

# Directory/file names skipped anywhere in a stack: caches, logs, and data the
# apps rebuild themselves.
# ponytail: prometheus/loki history isn't backed up (2.5G, regenerable); add a
# TSDB snapshot step if losing metric history ever matters.
backup_excludes:
  - prometheus
  - loki
  - cache
  - Cache
  - logs
  - log
  - logs.db*
  - transcodes
  - MediaCover
  - metadata
  - querylog.json*
  - Backups
  - backups
  - Sentry
  - Definitions
