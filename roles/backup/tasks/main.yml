---
# Backups are done by one script on the host (templates/backup.sh.j2), run daily by a
# systemd timer. Ansible only installs it, or runs it on demand - the host needs
# neither Ansible nor this repo.

- name: Backup setup
  when: backup_action in ['setup', 'timers']
  tags: [backup, backup-setup]
  block:
    - name: Install required packages
      ansible.builtin.package:
        name: [rsync, sqlite3]
        state: present

    - name: Pull rclone Docker image
      when: backup_s3_enabled
      ansible.builtin.command: docker pull rclone/rclone:1.75.2
      register: rclone_pull
      changed_when: "'Downloaded newer image' in rclone_pull.stdout"

    - name: Create backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
        owner: root
        group: root
      loop:
        - "{{ backup_base_dir }}"
        - "{{ backup_rclone_config_dir }}"

    - name: Configure rclone for S3
      when: backup_s3_enabled
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "{{ backup_rclone_config_dir }}/rclone.conf"
        mode: '0600'
        owner: root
        group: root
      no_log: true

    - name: Install backup script
      ansible.builtin.template:
        src: backup.sh.j2
        dest: /usr/local/bin/quadraplex-backup
        mode: '0700'
        owner: root
        group: root

    - name: Deploy systemd timers
      ansible.builtin.include_tasks: systemd-timers.yml

- name: Run backup ({{ backup_action }})
  when: backup_action in ['daily', 'all', 's3']
  ansible.builtin.command: /usr/local/bin/quadraplex-backup {{ 's3' if backup_action == 's3' else 'daily' }}
  register: backup_run
  changed_when: true
  tags: [backup]

- name: Show backup output
  when: backup_run is not skipped
  ansible.builtin.debug:
    var: backup_run.stdout_lines
  tags: [backup]

- name: Include restore tasks
  ansible.builtin.include_tasks: restore.yml
  when: backup_action == 'restore'
  tags: [restore]
