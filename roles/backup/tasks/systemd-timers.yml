---
# One daily timer runs the whole backup (archives, retention, S3 copy).

- name: Remove old per-category backup timers
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    state: stopped
    enabled: false
  loop: [backup-postgres-hourly, backup-s3-sync]
  failed_when: false

- name: Delete old per-category backup units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - backup-postgres-hourly.service
    - backup-postgres-hourly.timer
    - backup-s3-sync.service
    - backup-s3-sync.timer
  notify: Reload systemd

- name: Create systemd service for daily backups
  ansible.builtin.template:
    src: backup-systemd.service.j2
    dest: /etc/systemd/system/backup-daily.service
    mode: '0644'
  vars:
    service_name: backup-daily
    service_description: "Daily backup of all stacks"
    backup_command: "/usr/local/bin/quadraplex-backup daily"
  notify:
    - Reload systemd
    - Enable and start backup-daily timer

- name: Create systemd timer for daily backups
  ansible.builtin.template:
    src: backup-systemd.timer.j2
    dest: /etc/systemd/system/backup-daily.timer
    mode: '0644'
  vars:
    timer_name: backup-daily
    timer_description: "Run backup daily at 2 AM"
    timer_on_calendar: "02:00"
    timer_accuracy: "15min"
  notify:
    - Reload systemd
    - Enable and start backup-daily timer

- name: Flush handlers to start timers
  ansible.builtin.meta: flush_handlers
