---
# Restore a whole stack, or one service's configs/ + data/ folders, from a daily archive.
# Vars: restore_stack (required), restore_service (optional container name),
#       restore_date (e.g. 20261011) or restore_latest, restore_from_s3, restore_dry_run

- name: Validate restore parameters
  ansible.builtin.assert:
    that:
      - restore_stack is defined
      - restore_stack in (backup_stacks | map(attribute='name'))
    fail_msg: "restore_stack must be one of {{ backup_stacks | map(attribute='name') | join(', ') }}"

- name: Set restore paths
  ansible.builtin.set_fact:
    restore_dir: "{{ (backup_stacks | selectattr('name', 'equalto', restore_stack) | first).path }}"
    restore_paths: "{{ ['./configs/' + restore_service, './data/' + restore_service] if restore_service | default('') else ['.'] }}"

- name: Download archives from S3
  when: restore_from_s3 | default(false) | bool
  ansible.builtin.command: >
    {{ backup_rclone_bin }} copy
    {{ backup_s3_remote_name }}:{{ backup_s3_bucket }}/{{ backup_s3_path_prefix }}/{{ restore_stack }}/
    {{ backup_base_dir }}/{{ restore_stack }}/
    --include "*{{ restore_date | default('') }}*"
  changed_when: true

- name: Find archives
  ansible.builtin.find:
    paths: "{{ backup_base_dir }}/{{ restore_stack }}"
    patterns: "{{ restore_stack }}_*{{ restore_date | default('') }}*.tar.gz"
  register: found_archives

- name: Pick newest matching archive
  ansible.builtin.set_fact:
    restore_archive: "{{ (found_archives.files | sort(attribute='mtime') | last).path }}"
  failed_when: found_archives.files | length == 0

- name: Show what would be restored
  when: restore_dry_run | default(false) | bool
  ansible.builtin.shell: >
    tar -tzf {{ restore_archive }} {{ restore_paths | join(' ') }} 2>/dev/null | head -50
  changed_when: false
  register: restore_preview

- name: Dry-run summary
  when: restore_dry_run | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ ['Would restore ' ~ (restore_paths | join(', ')) ~ ' from ' ~ restore_archive ~ ' into ' ~ restore_dir] + restore_preview.stdout_lines }}"

- name: Restore
  when: not (restore_dry_run | default(false) | bool)
  block:
    - name: Confirm restore
      ansible.builtin.pause:
        prompt: "Overwrite {{ restore_paths | join(', ') }} in {{ restore_dir }} from {{ restore_archive | basename }}? (yes/no)"
      register: restore_confirm

    - name: Abort if not confirmed
      when: restore_confirm.user_input | lower != 'yes'
      ansible.builtin.fail:
        msg: "Restore cancelled"

    - name: Stop {{ restore_service | default(restore_stack + ' stack') }}
      ansible.builtin.command: >-
        {{ ('docker stop ' + restore_service) if restore_service | default('')
           else ('systemctl stop ' + restore_stack + '-stack') }}
      changed_when: true

    - name: Extract archive
      ansible.builtin.command: >
        tar -xzf {{ restore_archive }} -C {{ restore_dir }} --wildcards {{ restore_paths | join(' ') }}
      register: restore_extract
      changed_when: true
      # One service may have only configs/ or only data/; tar fails on the missing one.
      failed_when: restore_extract.rc != 0 and 'Not found in archive' not in restore_extract.stderr

  always:
    - name: Start {{ restore_service | default(restore_stack + ' stack') }}
      when: restore_confirm.user_input | default('') | lower == 'yes'
      ansible.builtin.command: >-
        {{ ('docker start ' + restore_service) if restore_service | default('')
           else ('systemctl start ' + restore_stack + '-stack') }}
      changed_when: true
