---
# Per-database SQLite backup logic, included with a loop from sqlite-backup.yml.
# (Ansible doesn't allow `loop:` directly on a `block:`, so the loop lives on the
# include_tasks call in sqlite-backup.yml instead, with this file as the per-item body.)

- name: Check if SQLite database file exists
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: sqlite_file_stat

- name: Check if container is running
  when: sqlite_file_stat.stat.exists
  ansible.builtin.command: >
    docker ps --filter "name={{ item.container }}" --filter "status=running" --format "{{ '{{' }}.Names{{ '}}' }}"
  register: container_check
  changed_when: false
  failed_when: false

- name: Backup SQLite database {{ item.name }}
  when: sqlite_file_stat.stat.exists and container_check.stdout != ""
  block:
    - name: Backup using SQLite .backup command
      ansible.builtin.command: >
        sqlite3 {{ item.path }} ".backup '{{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.db'"
      register: sqlite_backup_result
      changed_when: sqlite_backup_result.rc == 0
      failed_when: false

    - name: Fallback to file copy if .backup fails
      when: sqlite_backup_result.rc != 0
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.db"
        remote_src: true
        mode: '0600'
        owner: root
        group: root
      register: sqlite_copy_result

    - name: Compress SQLite backup
      when: sqlite_backup_result.rc == 0 or sqlite_copy_result is changed
      ansible.builtin.command: >
        gzip -{{ backup_compression_level }} {{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.db
      register: compress_result
      changed_when: compress_result.rc == 0

    - name: Verify compressed backup exists
      when: (compress_result.rc | default(1)) == 0
      ansible.builtin.stat:
        path: "{{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.db.gz"
      register: compressed_backup_stat

    - name: Verify backup integrity
      when: compressed_backup_stat.stat.exists | default(false)
      block:
        # sqlite3 needs a real seekable file (it seeks around pages for the
        # integrity check) - it can't open a pipe like /dev/stdin, so decompress
        # to a real temp file first rather than piping gunzip straight into it.
        - name: Decompress backup to a temp file and check integrity
          ansible.builtin.command: >
            sh -c "gunzip -k -c {{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.db.gz > /tmp/{{ item.name }}_{{ backup_timestamp }}_check.db && sqlite3 /tmp/{{ item.name }}_{{ backup_timestamp }}_check.db 'PRAGMA integrity_check;'"
          register: integrity_check
          changed_when: false
          failed_when: integrity_check.stdout != "ok"
      always:
        - name: Clean up temporary integrity-check file
          ansible.builtin.file:
            path: "/tmp/{{ item.name }}_{{ backup_timestamp }}_check.db"
            state: absent

    - name: Log successful backup
      when: (compressed_backup_stat.stat.exists | default(false)) and (integrity_check.stdout | default('')) == "ok"
      ansible.builtin.debug:
        msg: "Successfully backed up {{ item.name }} database ({{ compressed_backup_stat.stat.size | human_readable }})"

    - name: Send Gotify notification on failure
      when: >
        backup_gotify_enabled and
        (not (compressed_backup_stat.stat.exists | default(false)) or (integrity_check.stdout | default('')) != "ok")
      ansible.builtin.uri:
        url: "{{ backup_gotify_url }}/message"
        method: POST
        headers:
          X-Gotify-Key: "{{ backup_gotify_token }}"
        body_format: json
        body:
          title: "Backup Failed: {{ item.name }}"
          message: "SQLite backup failed for {{ item.name }} on {{ inventory_hostname }}"
          priority: 8
      failed_when: false

- name: Skip backup if database not found or container not running
  when: not sqlite_file_stat.stat.exists or container_check.stdout == ""
  ansible.builtin.debug:
    msg: "Skipping {{ item.name }} backup - database not found or container not running"
