---
# Data backup tasks (Prometheus TSDB, etc.)

- name: Set backup timestamp
  ansible.builtin.set_fact:
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
  run_once: true
  when: backup_timestamp is not defined

- name: Backup data directories
  when: backup_target_stack is not defined or item.stack == backup_target_stack
  loop: "{{ backup_services.data }}"
  loop_control:
    label: "{{ item.name }} ({{ item.stack }})"
  block:
    - name: Backup Prometheus TSDB
      when: item.type == 'prometheus_snapshot'
      block:
        - name: Check if Prometheus container is running
          ansible.builtin.command: >
            docker ps --filter "name={{ item.container }}" --filter "status=running" --format "{{ '{{' }}.Names{{ '}}' }}"
          register: prometheus_check
          changed_when: false
          failed_when: false

        - name: Create Prometheus snapshot via API
          when: prometheus_check.stdout != ""
          ansible.builtin.uri:
            url: "http://localhost:9090/api/v1/admin/tsdb/snapshot"
            method: POST
          register: prometheus_snapshot
          failed_when: false

        - name: Get snapshot name from response
          when: prometheus_snapshot.status == 200 and prometheus_snapshot.json.status == "success"
          ansible.builtin.set_fact:
            snapshot_name: "{{ prometheus_snapshot.json.data.name }}"

        - name: Create archive from snapshot
          when: snapshot_name is defined
          ansible.builtin.command: >
            tar -czf {{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz
            -C {{ item.path }}/snapshots {{ snapshot_name }}
          register: tar_result
          changed_when: tar_result.rc == 0

        - name: Remove snapshot directory after backup
          when: snapshot_name is defined and tar_result.rc == 0
          ansible.builtin.file:
            path: "{{ item.path }}/snapshots/{{ snapshot_name }}"
            state: absent

        - name: Verify backup archive exists
          when: tar_result.rc == 0
          ansible.builtin.stat:
            path: "{{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz"
          register: backup_archive_stat

        - name: Set backup permissions
          when: backup_archive_stat.stat.exists
          ansible.builtin.file:
            path: "{{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz"
            mode: '0600'
            owner: root
            group: root

        - name: Log successful backup
          when: backup_archive_stat.stat.exists
          ansible.builtin.debug:
            msg: "Successfully backed up {{ item.name }} data ({{ backup_archive_stat.stat.size | human_readable }})"

        - name: Send Gotify notification on failure
          when: >
            backup_gotify_enabled and
            (prometheus_check.stdout == "" or prometheus_snapshot.status != 200 or not backup_archive_stat.stat.exists)
          ansible.builtin.uri:
            url: "{{ backup_gotify_url }}/message"
            method: POST
            headers:
              X-Gotify-Key: "{{ backup_gotify_token }}"
            body_format: json
            body:
              title: "Backup Failed: {{ item.name }}"
              message: "Data backup failed for {{ item.name }} on {{ inventory_hostname }}"
              priority: 8
          failed_when: false

    - name: Backup generic data directory
      when: item.type is not defined or item.type != 'prometheus_snapshot'
      block:
        - name: Check if data directory exists
          ansible.builtin.stat:
            path: "{{ item.path }}"
          register: data_dir_stat

        - name: Create compressed archive
          when: data_dir_stat.stat.exists and data_dir_stat.stat.isdir
          ansible.builtin.command: >
            tar -czf {{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz
            -C {{ item.path | dirname }} {{ item.path | basename }}
          register: tar_result
          changed_when: tar_result.rc == 0

        - name: Verify backup archive exists
          when: tar_result.rc == 0
          ansible.builtin.stat:
            path: "{{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz"
          register: backup_archive_stat

        - name: Set backup permissions
          when: backup_archive_stat.stat.exists
          ansible.builtin.file:
            path: "{{ backup_base_dir }}/{{ item.stack }}/data/{{ item.name }}_{{ backup_timestamp }}.tar.gz"
            mode: '0600'
            owner: root
            group: root

        - name: Log successful backup
          when: backup_archive_stat.stat.exists
          ansible.builtin.debug:
            msg: "Successfully backed up {{ item.name }} data ({{ backup_archive_stat.stat.size | human_readable }})"
