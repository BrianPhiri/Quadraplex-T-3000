---
# PostgreSQL backup tasks

- name: Set backup timestamp
  ansible.builtin.set_fact:
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
  run_once: true

- name: Backup PostgreSQL databases
  when: backup_target_stack is not defined or item.stack == backup_target_stack
  loop: "{{ backup_services.postgres }}"
  loop_control:
    label: "{{ item.name }} ({{ item.stack }})"
  block:
    - name: Check if PostgreSQL container is running
      ansible.builtin.command: >
        docker ps --filter "name={{ item.container }}" --filter "status=running" --format "{{ '{{' }}.Names{{ '}}' }}"
      register: container_check
      changed_when: false
      failed_when: false

    - name: Backup PostgreSQL database {{ item.name }}
      when: container_check.stdout != ""
      block:
        - name: Create database dump for {{ item.name }}
          ansible.builtin.command: >
            docker exec {{ item.container }} pg_dump
            -U {{ item.user }}
            -d {{ item.database }}
            -F custom
            -Z {{ backup_compression_level }}
            -f /tmp/{{ item.name }}_{{ backup_timestamp }}.dump
          environment:
            PGPASSWORD: "{{ lookup('vars', 'backup_' + item.name + '_db_password', default='') }}"
          register: pg_dump_result
          changed_when: pg_dump_result.rc == 0
          failed_when: false

        - name: Copy dump from container to backup directory
          when: pg_dump_result.rc == 0
          ansible.builtin.command: >
            docker cp
            {{ item.container }}:/tmp/{{ item.name }}_{{ backup_timestamp }}.dump
            {{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.dump
          register: copy_result
          changed_when: copy_result.rc == 0

        - name: Clean up dump from container
          when: pg_dump_result.rc == 0
          ansible.builtin.command: >
            docker exec {{ item.container }} rm -f /tmp/{{ item.name }}_{{ backup_timestamp }}.dump
          changed_when: false
          failed_when: false

        - name: Verify backup file exists
          when: copy_result.rc == 0
          ansible.builtin.stat:
            path: "{{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.dump"
          register: backup_file_stat

        - name: Set backup permissions
          when: backup_file_stat.stat.exists
          ansible.builtin.file:
            path: "{{ backup_base_dir }}/{{ item.stack }}/databases/{{ item.name }}_{{ backup_timestamp }}.dump"
            mode: '0600'
            owner: root
            group: root

        - name: Log successful backup
          when: backup_file_stat.stat.exists
          ansible.builtin.debug:
            msg: "Successfully backed up {{ item.name }} database ({{ backup_file_stat.stat.size | human_readable }})"

        - name: Send Gotify notification on failure
          when: >
            backup_gotify_enabled and
            (pg_dump_result.rc != 0 or copy_result.rc != 0 or not backup_file_stat.stat.exists)
          ansible.builtin.uri:
            url: "{{ backup_gotify_url }}/message"
            method: POST
            headers:
              X-Gotify-Key: "{{ backup_gotify_token }}"
            body_format: json
            body:
              title: "Backup Failed: {{ item.name }}"
              message: "PostgreSQL backup failed for {{ item.name }} on {{ inventory_hostname }}"
              priority: 8
          failed_when: false

    - name: Skip backup if container not running
      when: container_check.stdout == ""
      ansible.builtin.debug:
        msg: "Skipping {{ item.name }} backup - container {{ item.container }} not running"
