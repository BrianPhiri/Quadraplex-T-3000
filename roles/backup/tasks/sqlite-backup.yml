---
# SQLite backup tasks

- name: Set backup timestamp
  ansible.builtin.set_fact:
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
  run_once: true
  when: backup_timestamp is not defined

- name: Backup SQLite databases
  include_tasks: sqlite-backup-item.yml
  when: backup_target_stack is not defined or item.stack == backup_target_stack
  loop: "{{ backup_services.sqlite }}"
  loop_control:
    label: "{{ item.name }} ({{ item.stack }})"
