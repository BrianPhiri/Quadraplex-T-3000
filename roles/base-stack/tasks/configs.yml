---
- name: Generate environment file
  template:
    src: .env.j2
    dest: "{{ stack_config.base_path }}/.env"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0600'
    backup: yes
  no_log: true
  notify: "restart {{ stack_name }}"

- name: Create Prometheus config directory
  file:
    path: "{{ stack_config.config_path }}/prometheus"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  when:
    - stack_name == 'utility-stack'
    - "'prometheus' in services"

- name: Deploy Prometheus configuration
  template:
    src: configs/prometheus.yml.j2
    dest: "{{ stack_config.config_path }}/prometheus/prometheus.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'prometheus' in services"

- name: Set proper ownership for all config files
  file:
    path: "{{ stack_config.config_path }}"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    recurse: yes

- name: Deploy Grafana Prometheus datasource provisioning
  template:
    src: configs/grafana/datasources/prometheus.yml.j2
    dest: "{{ stack_config.data_path }}/grafana/provisioning/datasources/prometheus.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'grafana' in services"
    - "'prometheus' in services"

- name: Deploy Grafana Loki datasource provisioning
  template:
    src: configs/grafana/datasources/loki.yml.j2
    dest: "{{ stack_config.data_path }}/grafana/provisioning/datasources/loki.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'grafana' in services"
    - "'loki' in services"

- name: Create Loki config directory
  file:
    path: "{{ stack_config.config_path }}/loki"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  when:
    - stack_name == 'utility-stack'
    - "'loki' in services"

- name: Deploy Loki configuration
  template:
    src: configs/loki.yml.j2
    dest: "{{ stack_config.config_path }}/loki/config.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'loki' in services"

- name: Create Promtail config directory
  file:
    path: "{{ stack_config.config_path }}/promtail"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  when:
    - stack_name == 'utility-stack'
    - "'promtail' in services"

- name: Deploy Promtail configuration
  template:
    src: configs/promtail.yml.j2
    dest: "{{ stack_config.config_path }}/promtail/config.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'promtail' in services"

- name: Deploy Glance dashboard configuration
  template:
    src: configs/glance.yml.j2
    dest: "{{ stack_config.data_path }}/glance/glance.yml"
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0644'
  when:
    - stack_name == 'utility-stack'
    - "'glance' in services"
  notify: "restart {{ stack_name }}"
