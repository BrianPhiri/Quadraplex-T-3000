---
- name: Create stack base directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  loop:
    - "{{ stack_config.base_path }}"
    - "{{ stack_config.config_path }}"
    - "{{ stack_config.data_path }}"

- name: Create service-specific config directories
  file:
    path: "{{ stack_config.config_path }}/{{ item }}"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  loop: "{{ stack_services }}"
  when: services[item].enabled | default(true)

- name: Create logs subdirectories for services that need them
  file:
    path: "{{ stack_config.config_path }}/{{ item }}/logs"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  loop: "{{ stack_services }}"
  when:
    - services[item].enabled | default(true)
    - item in ['seerr', 'sonarr', 'radarr', 'prowlarr', 'lidarr', 'bazarr']

- name: Create service-specific data directories
  file:
    path: "{{ stack_config.data_path }}/{{ item }}"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
  loop: "{{ stack_services }}"
  when: services[item].enabled | default(true)

# Permissions already set per-service above - recursive operation removed for performance

- name: Create backup directory
  file:
    path: "{{ stack_config.base_path }}/backups"
    state: directory
    owner: "{{ stack_user_id }}"
    group: "{{ stack_group_id }}"
    mode: '0755'
