---
# AdGuardHome.yaml is the app's own file (the UI writes to it), so deploy merges
# services.adguard_home.settings, http.address and the vault's users on top of it; keys not
# in settings stay UI-managed. No file yet (fresh server) -> settings become the whole file,
# skipping the setup wizard. Edited while stopped, like lazylibrarian.yml.
- name: AdGuard Home - read AdGuardHome.yaml
  slurp:
    path: "{{ stack.config_path }}/adguard_home/AdGuardHome.yaml"
  register: adguard_config
  failed_when: false

- name: AdGuard Home - apply repo settings (stopped while editing)
  when: adguard_current != adguard_wanted
  vars:
    adguard_current: "{{ (adguard_config.content | b64decode | from_yaml) if adguard_config.content is defined else {} }}"
    adguard_wanted: "{{ adguard_current | combine(services.adguard_home.settings,
                        {'http': {'address': '0.0.0.0:' ~ services.adguard_home.http}, 'users': vault_adguard_users},
                        recursive=True) }}"
  block:
    - command: docker stop adguardhome
    - copy:
        dest: "{{ stack.config_path }}/adguard_home/AdGuardHome.yaml"
        content: "{{ adguard_wanted | to_nice_yaml(indent=2, sort_keys=False) }}"
        mode: '0600'
        backup: true
    - command: docker start adguardhome
