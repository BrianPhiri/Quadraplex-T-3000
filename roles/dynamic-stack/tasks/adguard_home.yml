---
# AdGuardHome.yaml is the app's own file (UI changes, password hash, filters live there), so the
# repo only merges services.adguard_home.settings into it and leaves every other key alone.
# Edited while stopped, like lazylibrarian.yml. Skipped until first-run setup has created it.
- name: AdGuard Home - read AdGuardHome.yaml
  slurp:
    path: "{{ stack.config_path }}/adguard_home/AdGuardHome.yaml"
  register: adguard_config
  failed_when: false

- name: AdGuard Home - apply repo settings (stopped while editing)
  when:
    - adguard_config.content is defined
    - adguard_current != adguard_wanted
  vars:
    adguard_current: "{{ adguard_config.content | b64decode | from_yaml }}"
    adguard_wanted: "{{ adguard_current | combine(services.adguard_home.settings, {'http': {'address': '0.0.0.0:' ~ services.adguard_home.http}}, recursive=True) }}"
  block:
    - command: docker stop adguardhome
    - copy:
        dest: "{{ stack.config_path }}/adguard_home/AdGuardHome.yaml"
        content: "{{ adguard_wanted | to_nice_yaml(indent=2, sort_keys=False) }}"
        mode: '0600'
        backup: true
    - command: docker start adguardhome
