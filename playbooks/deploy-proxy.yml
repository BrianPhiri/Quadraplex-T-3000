---
- name: Deploy traefk 
  hosts: "{{ target_hosts }}"
  become: yes
  gather_facts: yes
  serial: "{{ deploy_serial | default(1) }}"

  vars_files:
    - ../vars/proxy/vault.yml
    - ../vars/proxy/base.yml
    - ../vars/proxy/traefik/traefik-routes.yml

  vars:
    stack_name: "proxy"
    services: "{{ proxy_services }}"

  pre_tasks:
    - name: Display deployment plan
      debug:
        msg:
          - "Deploying traefik to: {{ inventory_hostname }}"
          - " - Traefik: {{ proxy_services.traefik.enabled | default(false) }}"
          - " - Domain : {{ domain }}"
          - " - Dashboard: {{ proxy_services.traefik.dashboard.url }}"
      tags: always

  roles:
    - role: pre-checks
      tags: ["pre-check"]
    - role: traefik
      tags: ['traefik']

