---
# backup_action: setup (install script + timer), daily (run a backup now), s3 (copy to S3 now)

- name: Backup Infrastructure
  hosts: all
  become: true
  tasks:
    - name: Run backup role
      ansible.builtin.include_role:
        name: backup
        tasks_from: main.yml
      vars:
        backup_action: "{{ action | default('daily') }}"
