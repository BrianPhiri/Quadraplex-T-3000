---
# Restore a stack (or one service in it) from the daily backup archives.
# See roles/backup/tasks/restore.yml for the variables.

- name: Restore Infrastructure
  hosts: all
  become: true
  tasks:
    - name: Run restore operation
      ansible.builtin.include_role:
        name: backup
        tasks_from: main.yml
      vars:
        backup_action: "restore"
