---
# Media stack configuration
media_stack_base_path: "/opt/media-stack"
mount_path: "/mnt/media"
media_stack:
  # Paths
  base_path: "{{ media_stack_base_path }}"
  config_path: "{{ media_stack_base_path }}/configs"
  data_path: "{{ media_stack_base_path }}/data"
  downloads_path: "{{ mount_path }}/downloads"
  media_path: "{{ mount_path }}"

  # User configuration - flexible fallback to ansible_user if user not specified
  preferred_user: "{{ user | default(ansible_user) }}"
  user_id: "{{ user_id | default('1000')}}"
  group_id: "{{ group_id | default('1000')}}"
  timezone: "{{ timezone | default('Africa/Nairobi')}}"

  network_configs:
    media_net:
      name: media_net
      driver: bridge
    traefik_net:
      name: traefik_net
      external: true

  # Domain configuration
  # Supports: subdomain.domain, domain only, or localhost fallback
  domain: "{{ subdomain + '.' + my_domain if subdomain is defined and my_domain is defined else media_domain | default('localhost') }}"
  enable_ssl: true

  # Container versions (can be overridden per environment)
  versions:
    jellyfin: "12.4ubu2604-ls60"
    seerr: "v3.5.2"
    sonarr: "4.0.20.3014-ls329"
    radarr: "6.4.4.10685-ls327"
    prowlarr: "2.7.0.5723-ls168"
    bazarr: "latest"
    qbittorrent: "5.3.0_v2.1.2-ls487"
    releasarr: "latest"
    kavita: "v0.9.1.4-ls132"
    huntarr: "latest"
    filebrowser: "v2-s6"
    mylar: "v0.11.0-ls280"
    node_exporter: "latest"
    cadvisor: "latest"
    immich: "v2.7.5"
    freshrss: "latest"
    calibre: "latest"
    audiobookshelf: "2.38.0"
    lazylibrarian: "806f0479-ls401"
    shelfmark: "latest"
    profilarr: "2.3.1"
    qui: "v1.35.0"
    flaresolverr: "v3.5.2"

# Service configuration
media_services:
  filebrowser:
    enabled: false
    port: 89
    browse_path: "{{ mount_path }}"
    version: "{{ media_stack.versions.filebrowser | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "browse"
      domain: "{{ domain }}"
  # Solves Cloudflare challenges for Prowlarr indexers (Prowlarr > Settings > Indexers > FlareSolverr proxy).
  # Internal only: Prowlarr reaches it at http://flaresolverr:8191 on traefik_net.
  flaresolverr:
    enabled: true
    version: "{{ media_stack.versions.flaresolverr | default('latest') }}"
    networks:
      - traefik_net
  prowlarr:
    enabled: true
    version: "{{ media_stack.versions.prowlarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "prowlarr"
      domain: "{{ domain }}"
    # Switched off on deploy (prowlarr.yml); everything else about indexers stays UI-managed
    disabled_indexers: [Torrent Downloads, Internet Archive]
  sonarr:
    enabled: true
    version: "{{ media_stack.versions.sonarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "sonarr"
      domain: "{{ domain }}"
  radarr:
    enabled: true
    version: "{{ media_stack.versions.radarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "radarr"
      domain: "{{ domain }}"
  seerr:
    enabled: true
    version: "{{ media_stack.versions.seerr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "seerr"
      domain: "{{ domain }}"
  jellyfin:
    enabled: true
    version: "{{ media_stack.versions.jellyfin | default('latest') }}"
    port: 8096
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "watch"
      domain: "{{ domain }}"
  bazarr:
    enabled: false
    port: 6767
    version: "{{ media_stack.versions.bazarr | default('latest') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "bazarr"
      domain: "{{ domain }}"
  releasarr:
    enabled: false
    port: 1337
    version: "{{ media_stack.versions.releasarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "releasarr"
      domain: "{{ domain }}"
  huntarr:
    enabled: false
    port: 9705
    version: "{{ media_stack.versions.huntarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "huntarr"
      domain: "{{ domain }}"
  qbittorrent:
    enabled: true
    port: 8080
    peer_port: 6881
    version: "{{ media_stack.versions.qbittorrent | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "torrent"
      domain: "{{ domain }}"
    # App-owned conf (app_ini.yml): only these keys are set; WebUI password/session stay in the UI.
    # Categories live in categories.json, not here.
    ini_file: qBittorrent/qBittorrent.conf
    ini_no_extra_spaces: true
    ini_settings:
      BitTorrent:
        Session\DefaultSavePath: /downloads/
        Session\TempPath: /downloads/incomplete/
        Session\Port: "6881"  # = peer_port
        Session\QueueingSystemEnabled: "true"
        Session\MaxActiveDownloads: "10"
        Session\MaxActiveTorrents: "20"
        Session\MaxActiveUploads: "1"
        Session\GlobalMaxRatio: "0"
        Session\ShareLimitAction: Stop
      Preferences:
        Downloads\SavePath: /downloads/
        Downloads\TempPath: /downloads/incomplete/
        WebUI\Username: brian
  kavita:
    enabled: true
    internal_port: 5003
    version: "{{ media_stack.versions.kavita | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "kavita"
      domain: "{{ domain }}"
  mylar:
    enabled: true
    version: "{{ media_stack.versions.mylar | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "mylar"
      domain: "{{ domain }}"
    # App-owned config.ini (app_ini.yml): only these keys are set. The Prowlarr torznab indexers
    # ([Torznab] extra_torznabs, one flat comma list) stay UI/Prowlarr-managed.
    ini_file: mylar/config.ini
    ini_settings:
      General:
        destination_dir: /comics
        failed_download_handling: "True"
        failed_auto: "True"
      PostProcess:
        post_processing: "True"
        enable_check_folder: "True"
        check_folder: /downloads/comics
      CV:
        comicvine_api: "{{ vault_comicvine_api_key }}"
      Client:
        torrent_downloader: "5"  # qBittorrent
      Torrents:
        enable_torrents: "True"
        enable_torrent_search: "True"
      qBittorrent:
        qbittorrent_host: http://qbittorrent:8080
        qbittorrent_username: brian
        qbittorrent_password: "{{ vault_qbittorrent_password }}"
        qbittorrent_label: comics
        qbittorrent_folder: /downloads/comics
      DDL:
        enable_ddl: "True"
        enable_getcomics: "True"
        ddl_location: /downloads/mylar-ddl
  immich:
    enabled: false
    port: 2283
    version: "{{ media_stack.versions.immich | default('latest') }}"
    db:
      name: "immich"
      user: "benjamin"
      password: "{{ vault_immich_db_password | mandatory('vault_immich_db_password must be set in vault.yml before enabling immich') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "photos"
      domain: "{{ domain }}"
  freshrss:
    enabled: false
    port: 8089
    version: "{{ media_stack.versions.freshrss | default('latest') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "feed"
      domain: "{{ domain }}"
  calibre:
    enabled: false
    webserver_port: 8181
    version: "{{ media_stack.versions.calibre | default('latest') }}"
    # password: ""  # Optional: Set in vault.yml for GUI access
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "calibre"
      domain: "{{ domain }}"
  audiobookshelf:
    enabled: true
    version: "{{ media_stack.versions.audiobookshelf | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "audiobooks"
      domain: "{{ domain }}"
  lazylibrarian:
    enabled: true
    version: "{{ media_stack.versions.lazylibrarian | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "lazylibrarian"
      domain: "{{ domain }}"
    # Its startup logger prints changed config values (passwords included) to stdout before
    # reading config.ini; no setting turns that off, so keep stdout out of docker/Loki. Its own
    # file log (INFO by default) is unaffected.
    log_driver: none
    # App-owned config.ini (app_ini.yml): only these keys are set. LazyLibrarian drops keys left at
    # their default when it saves (e.g. loglevel 20, audiocat 3030), so only non-defaults go here.
    ini_file: config.ini
    ini_settings:
      GENERAL:
        ebook_dir: /books/ebooks
        audio_dir: /audiobooks
        download_dir: /downloads
      WEBSERVER:
        http_proxy: "True"  # honour Traefik's X-Forwarded-Proto so redirects stay https
      LOGGING:
        logfileredact: "True"
      TORRENT:
        tor_downloader_qbittorrent: "True"
      QBITTORRENT:
        qbittorrent_host: http://qbittorrent
        qbittorrent_port: "8080"
        qbittorrent_user: brian
        qbittorrent_pass: "{{ vault_qbittorrent_password }}"
        qbittorrent_label: books
      POSTPROCESS:
        audiobook_dest_folder: $Author/$Title
  shelfmark:
    enabled: false
    version: "{{ media_stack.versions.shelfmark | default('latest') }}"
    # calibre_url: "http://calibre:8181"  # Optional: Link to Calibre server
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "shelfmark"
      domain: "{{ domain }}"
  profilarr:
    enabled: true
    port: 6868
    version: "{{ media_stack.versions.profilarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "profilarr"
      domain: "{{ domain }}"
  qui:
    enabled: true
    port: 7476
    version: "{{ media_stack.versions.qui | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "qui"
      domain: "{{ domain }}"
