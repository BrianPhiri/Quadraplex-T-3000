---
# Media stack configuration
media_stack_base_path: "/opt/media-stack"
mount_path: "/mnt/media"
media_stack:
  # Paths
  base_path: "{{ media_stack_base_path }}"
  config_path: "{{ media_stack_base_path }}/configs"
  data_path: "{{ media_stack_base_path }}/data"
  downloads_path: "{{ mount_path }}/downloads"
  media_path: "{{ mount_path }}"

  # User configuration - flexible fallback to ansible_user if user not specified
  preferred_user: "{{ user | default(ansible_user) }}"
  user_id: "{{ user_id | default('1000')}}"
  group_id: "{{ group_id | default('1000')}}"
  timezone: "{{ timezone | default('Africa/Nairobi')}}"

  network_configs:
    media_net:
      name: media_net
      driver: bridge
    traefik_net:
      name: traefik_net
      external: true

  # Domain configuration
  # Supports: subdomain.domain, domain only, or localhost fallback
  domain: "{{ subdomain + '.' + my_domain if subdomain is defined and my_domain is defined else media_domain | default('localhost') }}"
  enable_ssl: true

  # Container versions (can be overridden per environment)
  versions:
    jellyfin: "latest"
    seerr: "latest"
    sonarr: "latest"
    radarr: "latest"
    prowlarr: "latest"
    bazarr: "latest"
    qbittorrent: "latest"
    releasarr: "latest"
    kavita: "latest"
    huntarr: "latest"
    filebrowser: "v2-s6"
    mylar: "latest"
    node_exporter: "latest"
    cadvisor: "latest"
    immich: "v2.3.1"
    freshrss: "latest"
    calibre: "latest"
    audiobookshelf: "latest"
    lazylibrarian: "latest"
    shelfmark: "latest"
    profilarr: "latest"
    qui: "latest"

# Service configuration
media_services:
  filebrowser:
    enabled: false
    port: 89
    browse_path: "{{ mount_path }}"
    version: "{{ media_stack.versions.filebrowser | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "browse"
      domain: "{{ domain }}"
  prowlarr:
    enabled: true
    version: "{{ media_stack.versions.prowlarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "prowlarr"
      domain: "{{ domain }}"
  sonarr:
    enabled: true
    version: "{{ media_stack.versions.sonarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "sonarr"
      domain: "{{ domain }}"
  radarr:
    enabled: true
    version: "{{ media_stack.versions.radarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "radarr"
      domain: "{{ domain }}"
  seerr:
    enabled: true
    version: "{{ media_stack.versions.seerr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "seerr"
      domain: "{{ domain }}"
  jellyfin:
    enabled: true
    version: "{{ media_stack.versions.jellyfin | default('latest') }}"
    port: 8096
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "watch"
      domain: "{{ domain }}"
  bazarr:
    enabled: false
    port: 6767
    version: "{{ media_stack.versions.bazarr | default('latest') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "bazarr"
      domain: "{{ domain }}"
  releasarr:
    enabled: false
    port: 1337
    version: "{{ media_stack.versions.releasarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "releasarr"
      domain: "{{ domain }}"
  huntarr:
    enabled: false
    port: 9705
    version: "{{ media_stack.versions.huntarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "huntarr"
      domain: "{{ domain }}"
  qbittorrent:
    enabled: true
    port: 8080
    peer_port: 6881
    version: "{{ media_stack.versions.qbittorrent | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "torrent"
      domain: "{{ domain }}"
  kavita:
    enabled: true
    internal_port: 5003
    version: "{{ media_stack.versions.kavita | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "kavita"
      domain: "{{ domain }}"
  mylar:
    enabled: true
    version: "{{ media_stack.versions.mylar | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "mylar"
      domain: "{{ domain }}"
  immich:
    enabled: false
    port: 2283
    version: "{{ media_stack.versions.immich | default('latest') }}"
    db:
      name: "immich"
      user: "benjamin"
      password: "{{ vault_immich_db_password | mandatory('vault_immich_db_password must be set in vault.yml before enabling immich') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "photos"
      domain: "{{ domain }}"
  freshrss:
    enabled: false
    port: 8089
    version: "{{ media_stack.versions.freshrss | default('latest') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "feed"
      domain: "{{ domain }}"
  calibre:
    enabled: false
    webserver_port: 8181
    version: "{{ media_stack.versions.calibre | default('latest') }}"
    # password: ""  # Optional: Set in vault.yml for GUI access
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "calibre"
      domain: "{{ domain }}"
  audiobookshelf:
    enabled: false
    version: "{{ media_stack.versions.audiobookshelf | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "audiobooks"
      domain: "{{ domain }}"
  lazylibrarian:
    enabled: false
    version: "{{ media_stack.versions.lazylibrarian | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "lazylibrarian"
      domain: "{{ domain }}"
  shelfmark:
    enabled: false
    version: "{{ media_stack.versions.shelfmark | default('latest') }}"
    # calibre_url: "http://calibre:8181"  # Optional: Link to Calibre server
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "shelfmark"
      domain: "{{ domain }}"
  profilarr:
    enabled: true
    port: 6868
    version: "{{ media_stack.versions.profilarr | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "profilarr"
      domain: "{{ domain }}"
  qui:
    enabled: true
    port: 7476
    version: "{{ media_stack.versions.qui | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "qui"
      domain: "{{ domain }}"
