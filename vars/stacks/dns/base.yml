---
dns_stack_base_path: "/opt/dns-stack"
dns_stack:
  # Paths
  base_path: "{{ dns_stack_base_path }}"
  config_path: "{{ dns_stack_base_path }}/configs"
  data_path: "{{ dns_stack_base_path }}/data"

  # User configuration - flexible fallback to ansible_user if user not specified
  preferred_user: "{{ user | default(ansible_user) }}"
  user_id: "{{ user_id | default('1000')}}"
  group_id: "{{ group_id | default('1000')}}"
  timezone: "{{ timezone | default('Africa/Nairobi')}}"

  # Network
  network_configs:
    dns_net:
      name: dns_net
      driver: bridge

  versions:
    adguard_home: "v0.107.79"
    cadvisor: "v0.60.6"
    node_exporter: "v1.12.1"

# Service configuration
dns_services:
  cadvisor:
    enabled: false
    version: "{{ dns_stack.versions.cadvisor | default('latest') }}"
  node_exporter:
    enabled: false
    version: "{{ dns_stack.versions.node_exporter | default('latest') }}"
  adguard_home:
    enabled: true
    http: 81
    https: 8443
    version: "{{ dns_stack.versions.adguard_home | default('latest') }}"
    # Full AdGuardHome.yaml, imported from the live server 2026-10-25 - deploy writes it on a
    # fresh server (no setup wizard) and merges it on top of UI changes otherwise
    # (tasks/adguard_home.yml). Not here: http.address (from http above) and users (vault).
    # Changed something in the UI? Copy it here too, or the next deploy reverts it.
    settings:
      http:
        pprof:
          port: 6060
          enabled: false
        doh:
          routes:
          - GET /dns-query
          - POST /dns-query
          - GET /dns-query/{ClientID}
          - POST /dns-query/{ClientID}
          insecure_enabled: false
        session_ttl: 30d
      auth_attempts: 5
      block_auth_min: 15
      http_proxy: ''
      language: ''
      theme: auto
      dns:
        bind_hosts:
        - 0.0.0.0
        port: 53
        anonymize_client_ip: false
        ratelimit: 20
        ratelimit_subnet_len_ipv4: 24
        ratelimit_subnet_len_ipv6: 56
        ratelimit_whitelist: []
        refuse_any: true
        upstream_dns:
        - https://dns10.quad9.net/dns-query
        upstream_dns_file: ''
        bootstrap_dns:
        - 9.9.9.10
        - 149.112.112.10
        - 2620:fe::10
        - 2620:fe::fe:10
        fallback_dns: []
        upstream_mode: load_balance
        fastest_timeout: 1s
        allowed_clients: []
        disallowed_clients: []
        blocked_hosts:
        - version.bind
        - id.server
        - hostname.bind
        trusted_proxies:
        - 127.0.0.0/8
        - ::1/128
        cache_enabled: true
        cache_size: 4194304
        cache_ttl_min: 0
        cache_ttl_max: 0
        cache_optimistic: false
        cache_optimistic_answer_ttl: 30s
        cache_optimistic_max_age: 12h
        bogus_nxdomain: []
        aaaa_disabled: false
        enable_dnssec: false
        edns_client_subnet:
          custom_ip: ''
          enabled: false
          use_custom: false
        max_goroutines: 300
        handle_ddr: true
        ipset: []
        ipset_file: ''
        bootstrap_prefer_ipv6: false
        upstream_timeout: 10s
        private_networks: []
        use_private_ptr_resolvers: true
        local_ptr_upstreams: []
        use_dns64: false
        dns64_prefixes: []
        serve_http3: false
        use_http3_upstreams: false
        serve_plain_dns: true
        hostsfile_enabled: true
        pending_requests:
          enabled: true
      tls:
        enabled: false
        server_name: ''
        force_https: false
        port_https: 443
        port_dns_over_tls: 853
        port_dns_over_quic: 853
        port_dnscrypt: 0
        dnscrypt_config_file: ''
        certificate_chain: ''
        private_key: ''
        certificate_path: ''
        private_key_path: ''
        strict_sni_check: false
      querylog:
        dir_path: ''
        ignored: []
        interval: 7d
        size_memory: 1000
        enabled: true
        ignored_enabled: false
        file_enabled: true
      statistics:
        dir_path: ''
        ignored: []
        interval: 1d
        enabled: true
        ignored_enabled: false
      filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
      - enabled: false
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
        name: AdAway Default Blocklist
        id: 2
      whitelist_filters: []
      user_rules: []
      dhcp:
        enabled: false
        interface_name: ''
        local_domain_name: lan
        dhcpv4:
          gateway_ip: ''
          subnet_mask: ''
          range_start: ''
          range_end: ''
          lease_duration: 86400
          icmp_timeout_msec: 1000
          options: []
        dhcpv6:
          range_start: ''
          lease_duration: 86400
          ra_slaac_only: false
          ra_allow_slaac: false
      filtering:
        blocking_ipv4: ''
        blocking_ipv6: ''
        blocked_services:
          schedule:
            time_zone: UTC
          ids: []
        protection_disabled_until: null
        safe_search:
          enabled: true
          bing: true
          duckduckgo: true
          ecosia: true
          google: true
          pixabay: true
          yandex: true
          youtube: true
        blocking_mode: default
        parental_block_host: family-block.dns.adguard.com
        safebrowsing_block_host: standard-block.dns.adguard.com
        rewrites:
        - domain: '*.media.brianphiri.digital'
          answer: 192.168.100.26
          enabled: true
        - domain: '*.home.brianphiri.digital'
          answer: 192.168.100.26
          enabled: true
        safe_fs_patterns:
        - /opt/adguardhome/work/userfilters/*
        max_http_size: 256MB
        safebrowsing_cache_size: 1048576
        safesearch_cache_size: 1048576
        parental_cache_size: 1048576
        cache_time: 30
        filters_update_interval: 24
        blocked_response_ttl: 10
        filtering_enabled: true
        rewrites_enabled: true
        parental_enabled: false
        safebrowsing_enabled: true
        protection_enabled: true
      clients:
        runtime_sources:
          whois: true
          arp: true
          rdns: true
          dhcp: true
          hosts: true
        persistent: []
      log:
        enabled: true
        file: ''
        max_backups: 0
        max_size: 100
        max_age: 3
        compress: false
        local_time: false
        verbose: false
      os:
        group: ''
        user: ''
        rlimit_nofile: 0
      schema_version: 34
