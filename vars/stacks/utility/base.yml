---
utility_systems_stack_base_path: "/opt/utility-stack"
utility_stack:
  # Paths
  base_path: "{{ utility_systems_stack_base_path }}"
  config_path: "{{ utility_systems_stack_base_path }}/configs"
  data_path: "{{ utility_systems_stack_base_path }}/data"
  media_path: "/mnt/utility"

  # User configuration - flexible fallback to ansible_user if user not specified
  preferred_user: "{{ user | default(ansible_user) }}"
  user_id: "{{ user_id | default('1000')}}"
  group_id: "{{ group_id | default('1000')}}"
  timezone: "{{ timezone | default('Africa/Nairobi')}}"

  stack_domain: "{{ domain }}"

  # Network
  network_configs:
    utility_net:
      name: utility_net
      driver: bridge
    traefik_net:
      name: traefik_net
      external: true

  # Container versions (can be overridden per environment)
  versions:
    grafana: "main"
    prometheus: "latest"
    uptime_kuma: "1"
    filebrowser: "v2-s6"
    filestash: "latest"
    adguard_home: "latest"
    filestash: "latest"
    glance: "latest"
    cadvisor: "latest"
    node_exporter: "latest"
    loki: "3"
    promtail: "3"
    homeassistant: "stable"
    pairdrop: "latest"
    portracker: "latest"
    mealie: "v3.24.0"


# Service configuration
utility_services:
  cadvisor:
    enabled: true
    port: 8081
    version: "{{ utility_stack.versions.cadvisor | default('latest') }}"
    networks:
      - traefik_net
  node_exporter:
    enabled: true
    port: 9100
    version: "{{ utility_stack.versions.node_exporter | default('latest') }}"
    networks:
      - traefik_net
  grafana:
    enabled: true
    version: "{{ utility_stack.versions.grafana | default('main') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "grafana"
      domain: "{{ utility_stack.stack_domain }}"
  prometheus:
    enabled: true
    port: 9090
    version: "{{ utility_stack.versions.prometheus | default('latest') }}"
    networks:
      - traefik_net
  loki:
    enabled: true
    version: "{{ utility_stack.versions.loki | default('3') }}"
    networks:
      - traefik_net
  promtail:
    enabled: true
    version: "{{ utility_stack.versions.promtail | default('3') }}"
    networks:
      - traefik_net
  pairdrop:
    enabled: false
    version: "{{ utility_stack.versions.pairdrop | default('latest') }}"
    ws_fallback: "false"
    rate_limit: "false"
    rtc_config: "false"
    debug_mode: "false"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "share"
      domain: "{{ utility_stack.stack_domain }}"
  gotify:
    enabled: true
    version: "{{ utility_stack.versions.gotify | default('latest') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "notify"
      domain: "{{ domain }}"
  homeassistant:
    enabled: false
    version: "{{ utility_stack.versions.homeassistant | default('stable') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "home"
      domain: "{{ domain }}"
  uptime_kuma:
    enabled: true
    version: "{{ utility_stack.versions.uptime_kuma | default('1') }}"
    dnss:
      - "{{ custom_dns | default('1.1.1.1') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "uptime"
      domain: "{{ utility_stack.stack_domain }}"
  filestash:
    enabled: false
    port: 8334
    version: "{{ utility_stack.versions.filestash | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: false
      host: "filestash"
      domain: "{{ utility_stack.stack_domain }}"
  glance:
    enabled: true
    port: 8082
    version: "{{ utility_stack.versions.glance | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "view"
      domain: "{{ utility_stack.stack_domain }}"
  portracker:
    enabled: true
    version: "{{ utility_stack.versions.portracker | default('latest') }}"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "ports"
      domain: "{{ utility_stack.stack_domain }}"
  mealie:
    enabled: true
    # SQLite install per https://docs.mealie.io/documentation/getting-started/installation/sqlite/
    # - no separate DB container/credentials needed. Traefik-only (no direct host port), matching
    # grafana/loki/promtail - avoids the double-exposure pattern flagged for other services.
    version: "{{ utility_stack.versions.mealie | default('v3.24.0') }}"
    allow_signup: "false"
    networks:
      - traefik_net
    traefik:
      enabled: true
      host: "mealie"
      domain: "{{ utility_stack.stack_domain }}"
